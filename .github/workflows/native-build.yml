name: Native builds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-package:
    timeout-minutes: 90
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build portable Linux tarball
        run: sh tools/build_linux_package.sh
      - name: Build Linux AppImage
        run: sh tools/make_linux_appimage.sh
      - name: Extract and verify final tarball
        run: |
          mkdir -p "work/package test"
          cd dist/linux
          sha256sum -c ./*.sha256
          tar -xzf ./*.tar.gz -C "../../work/package test"
          cd "../../work/package test"/AlfabetSmierci-*-linux-x86_64
          sha256sum -c SHA256SUMS
          echo "ALF_EXE=$PWD/AlfabetSmierci" >> "$GITHUB_ENV"
      - name: Linux location smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 tools/test_locations.py loc_04 loc_05
      - name: Linux save/load test
        run: python3 tools/test_linux_saves.py
      - name: Full packaged playthrough
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 tools/playthrough.py
      - name: AppImage save/load test without FUSE
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export ALF_EXE="$(find "$GITHUB_WORKSPACE/dist/linux" -maxdepth 1 -name '*.AppImage' -type f)"
          test -x "$ALF_EXE"
          python3 tools/test_linux_saves.py
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: alfabet-smierci-linux-x86_64
          if-no-files-found: error
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.sha256
            dist/linux/*.AppImage
            dist/linux/*.AppImage.sha256

  macos-build:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake pkgconf sdl3 libopenmpt
      - name: Configure and build
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel
      - name: Archive macOS development app
        run: |
          mkdir -p work
          tar -czf work/alfabet-smierci-macos.tar.gz -C build/native AlfabetSmierci.app
      - name: Upload macOS development app
        uses: actions/upload-artifact@v4
        with:
          name: alfabet-smierci-macos-development
          path: work/alfabet-smierci-macos.tar.gz
